name: Wordroot
options:
  bundleIdPrefix: com.heyitsmejosh
settings:
  MARKETING_VERSION: "1.0.1"
  CURRENT_PROJECT_VERSION: 7
  SWIFT_VERSION: "5.9"
targets:
  Wordroot:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    scheme:
      testTargets:
        - WordrootTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.etyma
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
      DEVELOPMENT_TEAM: QMM486NPYC
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Wordroot.entitlements
  WordrootTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Wordroot
    settings:
      GENERATE_INFOPLIST_FILE: YES
      # xcodegen emits an iOS-shaped TEST_HOST; on macOS the binary lives in Contents/MacOS.
      # BUNDLE_EXECUTABLE_FOLDER_PATH is empty on iOS, so one value covers both destinations.
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wordroot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Wordroot
