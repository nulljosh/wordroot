<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy — Wordroot</title>
<script src="i18n.js"></script>
<script>window.i18n.applyDocumentLanguage();</script>
<style>
  :root { --bg:#fff; --text:#252a49; --text2:#666; --accent:#5B9BD5;
  --link: #4779a6; --border:#e8e8e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111;
    --link: #5B9BD5; --text:#e8e8f0; --text2:rgba(232,232,240,.6); --border:rgba(232,232,240,.1); } }
  body { font-family:-apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); max-width:640px; margin:0 auto; padding:6vh 1rem 4rem; line-height:1.55; }
  h1 { font-size:1.4rem; letter-spacing:-.02em; }
  h2 { font-size:1rem; margin-top:2rem; }
  a { color: var(--link, var(--accent)); }
  .muted { color:var(--text2); font-size:.85rem; }
  .topbar { display:flex; align-items:baseline; justify-content:space-between; gap:.75rem; flex-wrap:wrap; }
  .topbar select {
    font:inherit; font-size:.8rem; padding:.3rem 1.6rem .3rem .5rem;
    border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text);
  }
</style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5B9BD5">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="topbar"><h1 id="heading"></h1><span id="picker"></span></div>
<p class="muted" id="updated"></p>
<main id="body"></main>
<p class="muted" style="margin-top:2rem"><a href="/" id="back"></a></p>
<script>
const t = (k, v) => i18n.t(k, v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// The policy is only accurate if it names what the page actually stores, so this date moves
// whenever a section below changes — not whenever a translation is tweaked.
const LAST_UPDATED = '2026-08-28';

/**
 * Translate a string whose placeholders stand for links. The template is escaped first and
 * the placeholders substituted after, so a translation can never inject markup.
 */
function withLinks(key, links) {
  let html = esc(t(key));
  for (const [name, { href, text }] of Object.entries(links)) {
    html = html.replace('{' + name + '}', `<a href="${esc(href)}">${esc(text)}</a>`);
  }
  return html;
}

document.title = t('privacy.title');
document.getElementById('heading').textContent = t('privacy.heading');
document.getElementById('picker').appendChild(i18n.localePicker(t('ui.interfaceLanguage')));

const date = new Intl.DateTimeFormat(i18n.locale, { dateStyle: 'long' })
  .format(new Date(LAST_UPDATED + 'T00:00:00Z'));
document.getElementById('updated').textContent = 'Wordroot · ' + t('privacy.lastUpdated', { date });

const sections = [
  ['privacy.collect.h', esc(t('privacy.collect.p'))],
  ['privacy.lookups.h', withLinks('privacy.lookups.p', {
    wiktionary: { href: 'https://en.wiktionary.org', text: t('ui.wiktionary') },
    policy: {
      href: 'https://foundation.wikimedia.org/wiki/Policy:Privacy_policy',
      text: t('privacy.policyLink'),
    },
  })],
  ['privacy.device.h', esc(t('privacy.device.p'))],
  ['privacy.children.h', esc(t('privacy.children.p'))],
  ['privacy.changes.h', esc(t('privacy.changes.p'))],
  ['privacy.contact.h', '<a href="mailto:trommatic@icloud.com">trommatic@icloud.com</a>'],
];
document.getElementById('body').innerHTML =
  sections.map(([h, p]) => `<h2>${esc(t(h))}</h2><p>${p}</p>`).join('');

// The arrow points back towards the start edge, which is the right one in Arabic.
document.getElementById('back').textContent =
  (i18n.dir === 'rtl' ? '→ ' : '← ') + t('privacy.back');
</script>
  <script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));</script>
</body>
</html>
